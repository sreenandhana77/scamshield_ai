services:
  - type: web
    name: scamshield-ai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./scamshield.db
